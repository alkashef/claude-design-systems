<!-- @dsCard group="Slides" height=1080 width=1920 subtitle="Opening and closing slide: kicker pinned to the top, a one-line serif title in the middle, and the byline under a hairline at the bottom" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>
<section class="slide sl-cover" data-toc="Title" data-layout="TitleSlide">
  <p class="sl-kicker">Series or event name</p>
  <h1 class="sl-display">Presentation title goes here</h1>
  <p class="sl-sub">Subtitle</p>
  <div class="sl-byline">
    <p class="sl-by"><b>Presenter name</b></p>
    <p class="sl-by">Role</p>
    <p class="sl-by">Date</p>
  </div>
</section>

</body></html>
