<!-- @dsCard group="Slides" height=1080 width=1920 subtitle="Process slide: a label at the top right, three columns joined by accent arrows, and up to three note rows under hairlines" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>
<section class="slide" data-layout="StepSlide">
  <div class="sl-head">
    <div><h2 class="sl-title">Step title</h2><p class="sl-subtitle">Step 1 of 3</p></div>
    <p class="sl-chip">Part 1 of 2: Name</p>
  </div>
  <div class="sl-flow">
    <div class="sl-col"><h3>Input</h3><p>What goes into this step.</p></div>
    <div class="sl-arrow" role="presentation"></div>
    <div class="sl-col"><h3>Action</h3><p>What you do in this step.</p></div>
    <div class="sl-arrow" role="presentation"></div>
    <div class="sl-col"><h3>Output</h3><p>What this step produces.</p></div>
  </div>
  <div class="sl-notes">
    <p class="sl-note"><b>Tool</b>Name of the tool</p>
    <p class="sl-note"><b>Where it helped</b>First use · Second use · Third use</p>
    <p class="sl-note"><b>Review notes</b>What you checked and what it changed before you moved on</p>
  </div>
</section>

</body></html>
