<!-- @dsCard group="Slides" height=1080 width=1920 subtitle="Process slide with a header chip, three cards joined by arrows, and up to three note rows" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>
<section class="slide sl-pad sl-step" data-layout="StepSlide">
  <div class="sl-head">
    <div><p class="sl-kicker">Step 1 of 3</p><h2 class="sl-title">Step title</h2></div>
    <p class="sl-chip">Part 1 of 2: Name</p>
  </div>
  <div class="sl-flow">
    <div class="sl-card"><h3>Input</h3><p>What goes into this step.</p></div>
    <div class="sl-arrow" role="presentation"></div>
    <div class="sl-card"><h3>Action</h3><p>What you do in this step.</p></div>
    <div class="sl-arrow" role="presentation"></div>
    <div class="sl-card"><h3>Output</h3><p>What this step produces.</p></div>
  </div>
  <div class="sl-tag">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#d8cdb4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <div class="sl-note"><p><b>Tool:</b> Name of the tool</p></div>
  </div>
  <div class="sl-tag">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#d8cdb4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg>
    <div class="sl-note burnt"><p><b>Where it helped:</b> First use · Second use · Third use</p></div>
  </div>
  <div class="sl-tag">
    <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#d8cdb4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/></svg>
    <div class="sl-note ink"><p><b>Review notes:</b> What you checked and what it changed before you moved on</p></div>
  </div>
</section>
</body></html>
