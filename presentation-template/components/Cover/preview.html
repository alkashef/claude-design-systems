<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:960px;height:288px;overflow:hidden;background:var(--cream)}
svg{display:block}
.ink{fill:var(--ink)}.yolk{fill:var(--yolk)}.burnt{fill:var(--burnt)}.tint{fill:var(--ink-tint)}.cream{fill:var(--cream)}
.name{font:700 64px/.95 var(--font-sans);fill:var(--ink)}
.tag{font:400 14px var(--font-sans);fill:var(--slate)}
</style></head>
<body>
<svg viewBox="0 0 960 288" width="960" height="288" role="img" aria-label="Presentation Template">
<!-- blocks: ink 400x96, yolk 220x96, burnt 160x96, ink-tint 180x96 as one top band; name beneath at 64px (too wide for the 440px zone)
     arrangement: unequal bands bleeding off the top and both side edges, the way a deck title slide is composed
     pattern: discs, because the title slide sets a cream disc with a yolk disc inside it and radius-pill rounds every badge
     steps and radii: radius-pill (256px) rounds each disc; band height 96 = 6 x space-16; discs r 32, 14, 22, 32 -->
<rect class="ink" x="0" y="0" width="400" height="96"/>
<rect class="yolk" x="400" y="0" width="220" height="96"/>
<rect class="burnt" x="620" y="0" width="160" height="96"/>
<rect class="tint" x="780" y="0" width="180" height="96"/>
<circle class="cream" cx="320" cy="48" r="32"/>
<circle class="yolk" cx="335" cy="48" r="14"/>
<circle class="burnt" cx="510" cy="48" r="22"/>
<circle class="cream" cx="700" cy="48" r="22"/>
<circle class="ink" cx="870" cy="48" r="32"/>
<text class="name" x="32" y="190">Presentation Template</text>
<text class="tag" x="32" y="232">Cream and ink slides with a yolk accent, in an editable HTML shell.</text>
</svg>
</body></html>
