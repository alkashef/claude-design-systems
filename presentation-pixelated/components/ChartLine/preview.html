<!-- @dsCard group="Slides" height=1080 width=1920 subtitle="Stepped line plot of up to four series over time, with a legend and the last value labelled at each line end" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>html,body{margin:0}</style></head>
<body>
<section class="slide" data-layout="ChartLine">
  <h2 class="sl-title">Line plot</h2>
  <p class="sl-subtitle">Subtitle</p>
  <figure class="sl-chart" data-chart='{"type":"line","unit":"","x":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],"series":[{"name":"Series A","values":[12,14,15,18,20,22,25,27,30,32,35,38]},{"name":"Series B","values":[20,21,20,22,23,22,24,25,24,26,26,27]},{"name":"Series C","values":[15,16,15,15,16,17,16,17,17,18,17,18]}],"summary":"Line plot: three series over twelve months. Series A grows from 12 to 38; B from 20 to 27; C from 15 to 18."}'></figure>
  <p class="sl-source">Source: sample data for illustration.</p>
</section>

<script>
/* Pixelated charts: each <figure class="sl-chart" data-chart='{…}'> is drawn as inline SVG from its JSON.
   Change the numbers in data-chart and reload; the chart redraws. Types: bar, waffle, line, scatter. Every mark is square: no circles, no round caps. */
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var COL = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)'];
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function fmt(v) { return Number(v).toLocaleString('en-US', { maximumFractionDigits: 1 }); }
  function nice(max, count) {
    var raw = max / count, p = Math.pow(10, Math.floor(Math.log10(raw))), steps = [1, 2, 2.5, 5, 10], step = p;
    for (var i = 0; i < steps.length; i++) { if (steps[i] * p >= raw) { step = steps[i] * p; break; } }
    return { step: step, max: Math.ceil(max / step) * step };
  }
  function t(x, y, s, cls, anchor, extra) {
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" class="' + cls + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + (extra || '') + '>' + esc(s) + '</text>';
  }
  function sq(cx, cy, r, fill, ring, title) {
    return '<rect x="' + (cx - r).toFixed(1) + '" y="' + (cy - r).toFixed(1) + '" width="' + (2 * r) + '" height="' + (2 * r) + '" fill="' + fill + '"' +
      (ring ? ' stroke="var(--paper)" stroke-width="' + M.ring + '"' : '') + '>' + (title ? '<title>' + esc(title) + '</title>' : '') + '</rect>';
  }
  function legend(items, x, y) {
    var out = '', cx = x;
    items.forEach(function (it) {
      out += it.line
        ? '<line x1="' + cx + '" y1="' + (y - 7) + '" x2="' + (cx + 28) + '" y2="' + (y - 7) + '" stroke="' + it.color + '" stroke-width="' + M.line + '"/>'
        : sq(cx + M.dot, y - 7, M.dot, it.color);
      cx += it.line ? 40 : 26;
      out += t(cx, y, it.name, 'ch-legend');
      cx += it.name.length * 12 + 40;
    });
    return out;
  }
  function yAxis(L, R, T, B, H, max, step, unit) {
    var out = '';
    for (var v = 0; v <= max + 1e-9; v += step) {
      var y = H - B - (v / max) * (H - T - B);
      out += '<line class="' + (v === 0 ? 'ch-base' : 'ch-grid') + '" x1="' + L + '" x2="' + R + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>';
      out += t(L - 16, y + 7, fmt(v) + (unit || ''), 'ch-tick', 'end');
    }
    return out;
  }

  function bar(d, W, H) {
    var L = 88, R = W - 8, T = 56, B = 64, n = d.values.length;
    var nk = nice(Math.max.apply(null, d.values), 4), max = nk.max;
    var band = (R - L) / n, bw = Math.min(M.barMax, band * 0.5), out = yAxis(L, R, T, B, H, max, nk.step, d.unit);
    d.values.forEach(function (v, i) {
      var x = L + band * i + (band - bw) / 2, y = H - B - (v / max) * (H - T - B);
      var fill = i === d.highlight ? 'var(--chart-1)' : 'var(--chart-muted)';
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + (H - B - y).toFixed(1) + '" fill="' + fill + '"><title>' + esc(d.categories[i] + ': ' + fmt(v) + (d.unit || '')) + '</title></rect>';
      out += t(x + bw / 2, y - 14, fmt(v) + (d.unit || ''), i === d.highlight ? 'ch-value' : 'ch-value ch-quiet', 'middle');
      out += t(x + bw / 2, H - B + 38, d.categories[i], 'ch-label', 'middle');
    });
    return out;
  }

  /* waffle: 100 squares, 10 x 10, filled row by row in legend order. The old type name "pie" draws the same chart. */
  function waffle(d, W, H) {
    var total = d.values.reduce(function (a, b) { return a + b; }, 0), out = '';
    var raw = d.values.map(function (v) { return v / total * 100; }), cells = raw.map(Math.floor);
    var left = 100 - cells.reduce(function (a, b) { return a + b; }, 0);
    raw.map(function (r, i) { return [r - Math.floor(r), i]; }).sort(function (a, b) { return b[0] - a[0]; })
      .slice(0, left).forEach(function (o) { cells[o[1]]++; });
    var side = Math.min(H - 16, W * 0.42), g = M.gap, c = (side - g * 9) / 10, x0 = 8, y0 = (H - side) / 2, k = 0;
    /* parts 1 to 4 take the chart colours in order; a fifth part (Other) takes chart-muted, never a repeat */
    var WC = function (i) { return i < 4 ? COL[i] : 'var(--chart-muted)'; };
    cells.forEach(function (cnt, i) {
      for (var j = 0; j < cnt; j++, k++) {
        out += '<rect x="' + (x0 + (k % 10) * (c + g)).toFixed(1) + '" y="' + (y0 + Math.floor(k / 10) * (c + g)).toFixed(1) + '" width="' + c.toFixed(1) + '" height="' + c.toFixed(1) + '" fill="' + WC(i) + '"><title>' + esc(d.labels[i] + ': ' + cnt + '%') + '</title></rect>';
      }
    });
    /* legend list: swatch, name, share, split by hairlines */
    var lx0 = x0 + side + 120, lx1 = W - 8, rowH = 72, cy = H / 2, ly0 = cy - (d.values.length * rowH) / 2;
    cells.forEach(function (cnt, i) {
      var y = ly0 + i * rowH;
      out += '<line class="ch-grid" x1="' + lx0 + '" x2="' + lx1 + '" y1="' + y + '" y2="' + y + '"/>';
      out += sq(lx0 + M.dot, y + rowH / 2, M.dot, WC(i));
      out += t(lx0 + 40, y + rowH / 2 + 9, d.labels[i], 'ch-row');
      out += t(lx1, y + rowH / 2 + 9, cnt + '%', 'ch-row-value', 'end');
    });
    out += '<line class="ch-grid" x1="' + lx0 + '" x2="' + lx1 + '" y1="' + (ly0 + d.values.length * rowH) + '" y2="' + (ly0 + d.values.length * rowH) + '"/>';
    return out;
  }

  /* line: stepped, each value held across its own tick, with square joins and a square end mark */
  function line(d, W, H) {
    var L = 88, R = W - 220, T = 72, B = 64, n = d.x.length;
    var all = []; d.series.forEach(function (s) { all = all.concat(s.values); });
    var nk = nice(Math.max.apply(null, all), 4), max = nk.max, out = '';
    out += legend(d.series.map(function (s, i) { return { name: s.name, color: COL[i % 4], line: true }; }), L, 24);
    out += yAxis(L, R, T, B, H, max, nk.step, d.unit);
    var X = function (i) { return L + (R - L) * i / (n - 1); }, Y = function (v) { return H - B - (v / max) * (H - T - B); };
    d.x.forEach(function (lab, i) { out += t(X(i), H - B + 38, lab, 'ch-tick', 'middle'); });
    var ends = [];
    d.series.slice().reverse().forEach(function (s, ri) {
      var i0 = d.series.length - 1 - ri, c = COL[i0 % 4];
      var p = 'M' + X(0).toFixed(1) + ',' + Y(s.values[0]).toFixed(1);
      for (var i = 1; i < n; i++) p += 'H' + ((X(i - 1) + X(i)) / 2).toFixed(1) + 'V' + Y(s.values[i]).toFixed(1) + 'H' + X(i).toFixed(1);
      out += '<path d="' + p + '" fill="none" stroke="' + c + '" stroke-width="' + M.line + '" stroke-linejoin="miter"><title>' + esc(s.name) + '</title></path>';
      s.values.forEach(function (v, i) { out += '<rect x="' + (X(i) - 14).toFixed(1) + '" y="' + (Y(v) - 14).toFixed(1) + '" width="28" height="28" fill="transparent"><title>' + esc(s.name + ', ' + d.x[i] + ': ' + fmt(v) + (d.unit || '')) + '</title></rect>'; });
      var last = s.values[n - 1];
      out += sq(X(n - 1), Y(last), M.dot, c, true);
      ends.push({ y: Y(last), label: fmt(last) + (d.unit || ''), name: s.name });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 56) ends[k].y = ends[k - 1].y + 56;
    ends.forEach(function (e) {
      out += t(R + 24, e.y - 2, e.label, 'ch-value');
      out += t(R + 24, e.y + 24, e.name, 'ch-tick');
    });
    return out;
  }

  function scatter(d, W, H) {
    var L = 96, R = W - 24, T = 72, B = 96, out = '';
    var nx = nice(d.xMax || 100, 5), ny = nice(d.yMax || 100, 4);
    out += legend(d.groups.map(function (g, i) { return { name: g, color: i === 0 ? 'var(--chart-1)' : 'var(--chart-muted)' }; }), L, 24);
    out += yAxis(L, R, T, B, H, ny.max, ny.step, '');
    var X = function (v) { return L + (v / nx.max) * (R - L); }, Y = function (v) { return H - B - (v / ny.max) * (H - T - B); };
    for (var v = 0; v <= nx.max + 1e-9; v += nx.step) out += t(X(v), H - B + 38, fmt(v), 'ch-tick', 'middle');
    out += t(R, H - B + 80, d.xLabel, 'ch-label', 'end');
    var my = (T + H - B) / 2;
    out += t(24, my, d.yLabel, 'ch-label', 'middle', ' transform="rotate(-90 24 ' + my.toFixed(1) + ')"');
    var pts = d.points.slice().sort(function (a, b) { return b[2] - a[2]; });
    pts.forEach(function (p) {
      out += sq(X(p[0]), Y(p[1]), M.dot, p[2] === 0 ? 'var(--chart-1)' : 'var(--chart-muted)', true, d.groups[p[2]] + ': ' + fmt(p[0]) + ', ' + fmt(p[1]));
    });
    return out;
  }

  /* mark sizes come from the chart tokens (CSS custom properties on the slide) */
  var M = {};
  function readMarks(el) {
    var cs = getComputedStyle(el), px = function (n, d) { var v = parseFloat(cs.getPropertyValue(n)); return isNaN(v) ? d : v; };
    M = { barMax: px('--chart-bar-max', 88), line: px('--chart-line', 3), dot: px('--chart-dot', 8), ring: px('--chart-ring', 3), gap: px('--chart-gap', 4) };
  }
  var DRAW = { bar: bar, waffle: waffle, pie: waffle, line: line, scatter: scatter };
  window.renderCharts = function (root) {
    Array.prototype.forEach.call((root || document).querySelectorAll('.sl-chart[data-chart]'), function (fig) {
      var d; try { d = JSON.parse(fig.getAttribute('data-chart')); } catch (e) { return; }
      var cs = getComputedStyle(fig), W = fig.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), H = fig.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (!W || !H || !DRAW[d.type]) return;
      readMarks(fig);
      fig.innerHTML = '<svg xmlns="' + NS + '" class="ch" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(d.summary || '') + '">' + DRAW[d.type](d, W, H) + '</svg>';
    });
  };
})();
window.renderCharts(document);
</script>
</body></html>
